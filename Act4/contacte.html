
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacta amb nosaltres per enviar preguntes o comentaris.">
    <title>Contacte - Cercador de pel·lícules</title>
    <link rel="icon" href="hogar.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estils.css">
</head>

<body>

    <header>
        <a href="index.html">Torna a l'inici</a>
        <nav>
            <ul>
                <li><a href="index.html#buscador">Buscador</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main class="contacte">
        <h1>Contacte</h1>
        <p>
            Si tens alguna pregunta o suggeriment,
            pots escriure'ns amb aquest formulari.
        </p>
        <form action="#" method="post">
            <p>
                <label for="nom">Nom</label>

                <input
                    type="text"
                    id="nom"
                    name="nom"
                    autocomplete="name"
                    required
                >
            </p>
            <p>
                <label for="correu">Correu electrònic</label>
                <input type="email" id="correu" name="correu" autocomplete="email" required>
            </p>

            <p>
                <label for="missatge">Missatge</label>
                <textarea id="missatge" name="missatge" rows="6" required></textarea>
            </p>
            <button type="submit">Envia el missatge</button>
        </form>
    </main>

    <footer>
        <p>© 2026 The Movie Database - Maqueta de disseny</p>
    </footer>

</body>
</html>
