
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cerca pel·lícules i consulta informació sobre títols de cinema.">

    <title>Cercador de pel·lícules</title>

    <link rel="icon" href="/imatges/hogar.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estils.css">
</head>

<body>

    <header>
        <a href="index.html">
            <img src="https://www.themoviedb.org/assets/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg"
                 alt="The Movie Database" height="25">
        </a>

        <nav>
            <ul>
                <li><a href="#buscador">Buscador</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="buscador" class="buscador">

            <h1>Busca una pel·lícula</h1>

            <p>Milions de títols, un sol cercador.</p>

            <form method="get" action="https://www.themoviedb.org/search">

                <label for="consulta">Títol de la pel·lícula</label>

                <input
                    type="search"
                    id="consulta"
                    name="query"
                    placeholder="Cerca una pel·lícula, per exemple Dune..."
                    required
                >

                <button type="submit">Cercar</button>

            </form>

        </section>
        <section class="pelicules">
            <h2>Exemples de pel·lícules</h2>
            <div class="resultats">
                <article class="targeta">
                    <img src="imatges/Dune.webp"
                         alt="Dune: Part Two">
                    <h3>Dune: Part Two</h3>
                    <p>2024</p>
                </article>
                <article class="targeta">
                    <img src="imatges/lor.webp"
                         alt="The Lord of the Rings">
                    <h3>The Lord of the Rings: The Two Towers</h3>
                    <p>2002</p>
                </article>
                <article class="targeta">
                    <img src="imatges/spiderman.jpg"
                         alt="Spider-Man">
                    <h3>Spider-Man: Brand New Day</h3>
                    <p>2026</p>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 The Movie Database - Maqueta de disseny</p>
    </footer>
</body>
</html>
